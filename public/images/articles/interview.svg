<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="int-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0C1E2E" flood-opacity="0.08" />
    </filter>
    <filter id="int-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Clean Crisp White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Lights -->
  <circle cx="320" cy="200" r="260" fill="#F0F9FF" filter="url(#int-blur)"/>
  <circle cx="920" cy="240" r="260" fill="#E0F2FE" opacity="0.6" filter="url(#int-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="400" ry="20" fill="#E5E7EB" opacity="0.6"/>
  <ellipse cx="600" cy="582" rx="240" ry="12" fill="#BAE6FD" opacity="0.4"/>

  <!-- Central Video Conference / Meeting Laptop Display -->
  <g transform="translate(320, 80)" filter="url(#int-shadow)">
    <!-- Laptop Screen Shell -->
    <rect width="560" height="380" rx="24" fill="#0C1E2E"/>
    <!-- Screen Inner Display -->
    <rect x="16" y="16" width="528" height="348" rx="16" fill="#F0F9FF"/>

    <!-- Split Screen: Left Candidate Participant -->
    <g transform="translate(32, 32)">
      <rect width="236" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
      <!-- Candidate Avatar -->
      <circle cx="118" cy="110" r="44" fill="#E0F2FE"/>
      <circle cx="118" cy="100" r="20" fill="#0369A1"/>
      <path d="M92 142C92 126 104 122 118 122C132 122 144 126 144 142" fill="#0369A1"/>
      <!-- Audio wave indicator -->
      <g transform="translate(86, 175)">
        <line x1="0" y1="12" x2="0" y2="16" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
        <line x1="12" y1="6" x2="12" y2="22" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
        <line x1="24" y1="2" x2="24" y2="26" stroke="#0369A1" stroke-width="3" stroke-linecap="round"/>
        <line x1="36" y1="8" x2="36" y2="20" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
        <line x1="48" y1="12" x2="48" y2="16" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Identity placeholder -->
      <rect x="68" y="220" width="100" height="10" rx="5" fill="#0C1E2E"/>
      <rect x="88" y="238" width="60" height="6" rx="3" fill="#64748B"/>
    </g>

    <!-- Split Screen: Right Interviewer Participant -->
    <g transform="translate(292, 32)">
      <rect width="236" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
      <!-- Interviewer Avatar -->
      <circle cx="118" cy="110" r="44" fill="#E0F2FE"/>
      <circle cx="118" cy="100" r="20" fill="#0C1E2E"/>
      <path d="M92 142C92 126 104 122 118 122C132 122 144 126 144 142" fill="#0C1E2E"/>
      <!-- Video Live Indicator Badge -->
      <rect x="20" y="20" width="36" height="18" rx="9" fill="#0369A1"/>
      <circle cx="38" cy="29" r="4" fill="#FFFFFF"/>
      <!-- Identity placeholder -->
      <rect x="68" y="220" width="100" height="10" rx="5" fill="#0C1E2E"/>
      <rect x="88" y="238" width="60" height="6" rx="3" fill="#64748B"/>
    </g>

    <!-- Screen Bottom Controls Bar -->
    <g transform="translate(210, 322)">
      <circle cx="20" cy="15" r="14" fill="#0369A1"/>
      <circle cx="55" cy="15" r="14" fill="#0369A1"/>
      <circle cx="90" cy="15" r="14" fill="#0EA5E9"/>
      <circle cx="125" cy="15" r="14" fill="#DC2626"/>
    </g>
  </g>

  <!-- Laptop Base Stand -->
  <g transform="translate(260, 460)">
    <path d="M40 0 H640 L680 18 H0 Z" fill="#CBD5E1"/>
    <rect x="300" y="0" width="80" height="6" rx="3" fill="#0C1E2E"/>
  </g>

  <!-- Left Floating Schedule Calendar Card -->
  <g transform="translate(100, 150)" filter="url(#int-shadow)">
    <rect width="180" height="160" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Calendar Top -->
    <path d="M0 18C0 8.1 8.1 0 18 0H162C171.9 0 180 8.1 180 18V36H0V18Z" fill="#0369A1"/>
    <circle cx="45" cy="18" r="4" fill="#FFFFFF"/>
    <circle cx="135" cy="18" r="4" fill="#FFFFFF"/>
    <!-- Date display -->
    <circle cx="90" cy="90" r="32" fill="#E0F2FE"/>
    <rect x="75" y="80" width="30" height="8" rx="4" fill="#0369A1"/>
    <rect x="82" y="94" width="16" height="6" rx="3" fill="#0EA5E9"/>
    <!-- Time indicator -->
    <rect x="40" y="132" width="100" height="8" rx="4" fill="#E5E7EB"/>
  </g>

  <!-- Right Floating Dialogue Speech Bubble -->
  <g transform="translate(920, 160)" filter="url(#int-shadow)">
    <rect width="180" height="110" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M30 110L20 125L45 110Z" fill="#FFFFFF"/>
    <circle cx="34" cy="36" r="14" fill="#0EA5E9"/>
    <rect x="58" y="28" width="95" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="58" y="42" width="70" height="6" rx="3" fill="#64748B"/>
    <rect x="22" y="68" width="136" height="6" rx="3" fill="#E0F2FE"/>
    <rect x="22" y="82" width="100" height="6" rx="3" fill="#E0F2FE"/>
  </g>

  <!-- Right Lower Handshake / Offer Badge -->
  <g transform="translate(940, 330)" filter="url(#int-shadow)">
    <circle cx="45" cy="45" r="45" fill="#0369A1"/>
    <circle cx="45" cy="45" r="34" stroke="#0EA5E9" stroke-width="3"/>
    <!-- Handshake silhouette -->
    <path d="M28 45L38 35L48 45L40 53L35 48M62 45L52 35L44 43L50 49" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
