<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="sal-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0C1E2E" flood-opacity="0.08" />
    </filter>
    <filter id="sal-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Clean Crisp White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Lights -->
  <circle cx="300" cy="180" r="260" fill="#F0F9FF" filter="url(#sal-blur)"/>
  <circle cx="900" cy="220" r="260" fill="#E0F2FE" opacity="0.6" filter="url(#sal-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="400" ry="20" fill="#E5E7EB" opacity="0.6"/>
  <ellipse cx="600" cy="582" rx="240" ry="12" fill="#BAE6FD" opacity="0.4"/>

  <!-- Central Analytics Chart Card -->
  <g transform="translate(300, 70)" filter="url(#sal-shadow)">
    <rect width="600" height="460" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Top Card Header -->
    <rect x="40" y="36" width="140" height="14" rx="7" fill="#0C1E2E"/>
    <rect x="40" y="58" width="90" height="8" rx="4" fill="#64748B"/>
    <!-- Filter chip -->
    <rect x="460" y="36" width="100" height="28" rx="14" fill="#F0F9FF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="478" cy="50" r="5" fill="#0369A1"/>
    <rect x="492" y="47" width="50" height="6" rx="3" fill="#0369A1"/>

    <!-- Grid Lines -->
    <line x1="40" y1="120" x2="560" y2="120" stroke="#F0F9FF" stroke-width="1.5"/>
    <line x1="40" y1="190" x2="560" y2="190" stroke="#F0F9FF" stroke-width="1.5"/>
    <line x1="40" y1="260" x2="560" y2="260" stroke="#F0F9FF" stroke-width="1.5"/>
    <line x1="40" y1="330" x2="560" y2="330" stroke="#F0F9FF" stroke-width="1.5"/>
    <line x1="40" y1="400" x2="560" y2="400" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Bar Chart Columns (Ascending Salary Tiers) -->
    <!-- Column 1 -->
    <rect x="75" y="290" width="56" height="110" rx="10" fill="#E0F2FE"/>
    <!-- Column 2 -->
    <rect x="175" y="230" width="56" height="170" rx="10" fill="#BAE6FD"/>
    <!-- Column 3 -->
    <rect x="275" y="170" width="56" height="230" rx="10" fill="#0EA5E9"/>
    <!-- Column 4 (Hero High) -->
    <rect x="375" y="110" width="56" height="290" rx="10" fill="#0369A1"/>
    <!-- Column 5 -->
    <rect x="475" y="150" width="56" height="250" rx="10" fill="#0C1E2E"/>

    <!-- Smooth Trend Curve Line -->
    <path d="M103 270 Q 203 210, 303 150 T 403 95 T 503 130" stroke="#0369A1" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Data points -->
    <circle cx="103" cy="270" r="6" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
    <circle cx="203" cy="210" r="6" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
    <circle cx="303" cy="150" r="6" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
    <circle cx="403" cy="95" r="8" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="503" cy="130" r="6" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
  </g>

  <!-- Left Floating Compensation Tier Card -->
  <g transform="translate(80, 180)" filter="url(#sal-shadow)">
    <rect width="180" height="170" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Coin Icon -->
    <circle cx="45" cy="45" r="22" fill="#FEF3C7"/>
    <circle cx="45" cy="45" r="15" stroke="#D97706" stroke-width="2.5"/>
    <rect x="43" y="38" width="4" height="14" rx="2" fill="#D97706"/>

    <rect x="80" y="35" width="70" height="10" rx="5" fill="#0C1E2E"/>
    <rect x="80" y="50" width="45" height="7" rx="3.5" fill="#64748B"/>

    <rect x="24" y="85" width="132" height="8" rx="4" fill="#F0F9FF"/>
    <rect x="24" y="85" width="98" height="8" rx="4" fill="#0369A1"/>

    <rect x="24" y="108" width="80" height="7" rx="3.5" fill="#E5E7EB"/>
    <rect x="24" y="124" width="110" height="7" rx="3.5" fill="#E5E7EB"/>
  </g>

  <!-- Right Floating Growth Badge Card -->
  <g transform="translate(940, 200)" filter="url(#sal-shadow)">
    <rect width="180" height="150" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Growth Arrow Icon -->
    <circle cx="45" cy="45" r="22" fill="#E0F2FE"/>
    <path d="M35 55L55 35M55 35H40M55 35V50" stroke="#0369A1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="80" y="35" width="75" height="10" rx="5" fill="#0C1E2E"/>
    <rect x="80" y="50" width="50" height="7" rx="3.5" fill="#0EA5E9"/>

    <rect x="24" y="85" width="132" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="24" y="100" width="95" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="24" y="115" width="115" height="6" rx="3" fill="#E5E7EB"/>
  </g>
</svg>
