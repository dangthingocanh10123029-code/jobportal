<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="sal-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="sal-element-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="sal-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Pastel Blobs -->
  <circle cx="280" cy="180" r="270" fill="#CFFAFE" opacity="0.7" filter="url(#sal-blur)"/>
  <circle cx="950" cy="220" r="280" fill="#E8EFE8" opacity="0.6" filter="url(#sal-blur)"/>
  <circle cx="820" cy="510" r="240" fill="#E6E6FA" opacity="0.55" filter="url(#sal-blur)"/>
  <circle cx="200" cy="510" r="220" fill="#EFEDF4" opacity="0.5" filter="url(#sal-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="570" rx="420" ry="24" fill="#F1F5F9"/>
  <ellipse cx="600" cy="572" rx="260" ry="14" fill="#CFFAFE" opacity="0.5"/>

  <!-- Main Financial Analytics Card -->
  <g transform="translate(320, 80)" filter="url(#sal-shadow)">
    <rect width="560" height="400" rx="28" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>

    <!-- Header Section -->
    <g transform="translate(40, 36)">
      <!-- Metric Icon Badge in Cyan -->
      <circle cx="22" cy="22" r="22" fill="#CFFAFE"/>
      <path d="M14 26L20 20L25 24L31 16" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 16H31V21" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Skeleton Header Bars -->
      <rect x="60" y="10" width="180" height="14" rx="7" fill="#0E7490"/>
      <rect x="60" y="30" width="110" height="10" rx="5" fill="#94A3B8"/>

      <!-- Top Right Metric Pill (Growth Badge) -->
      <g transform="translate(360, 6)">
        <rect width="116" height="34" rx="17" fill="#E8EFE8"/>
        <path d="M18 20L23 15L28 19L34 13" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M30 13H34V17" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="42" y="13" width="58" height="8" rx="4" fill="#15803D"/>
      </g>
    </g>

    <!-- Hairline Separator -->
    <line x1="40" y1="96" x2="520" y2="96" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Main Chart Area -->
    <g transform="translate(40, 120)">
      <!-- Dotted Horizontal Guide Lines -->
      <line x1="0" y1="20" x2="480" y2="20" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="0" y1="70" x2="480" y2="70" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="0" y1="120" x2="480" y2="120" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="0" y1="170" x2="480" y2="170" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Smooth Area Under Growth Curve -->
      <path d="M20 150 C 90 145, 140 120, 200 100 C 260 80, 320 60, 380 35 C 410 22, 440 15, 460 10 L 460 170 L 20 170 Z" fill="url(#chart-area-grad)"/>

      <!-- Vertical Chart Columns (Soft Rounded Bars) -->
      <rect x="36" y="120" width="36" height="50" rx="10" fill="#E6E6FA"/>
      <rect x="126" y="95" width="36" height="75" rx="10" fill="#CFFAFE"/>
      <rect x="216" y="75" width="36" height="95" rx="10" fill="#E6E6FA"/>
      <rect x="306" y="45" width="36" height="125" rx="10" fill="#CFFAFE"/>
      <rect x="396" y="15" width="36" height="155" rx="10" fill="#06B6D4"/>

      <!-- Glowing Peak Column Cap -->
      <circle cx="414" cy="15" r="7" fill="#0E7490"/>
      <circle cx="414" cy="15" r="3" fill="#FFFFFF"/>

      <!-- Smooth Ascending Trend Curve Line -->
      <path d="M20 150 C 90 145, 140 120, 200 100 C 260 80, 320 60, 380 35 C 410 22, 440 15, 460 10" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- Curve Data Milestone Nodes -->
      <circle cx="54" cy="148" r="4.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
      <circle cx="144" cy="115" r="4.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
      <circle cx="234" cy="90" r="4.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
      <circle cx="324" cy="55" r="4.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
      <circle cx="414" cy="22" r="5.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>

    <!-- Bottom Metric Pills Row -->
    <g transform="translate(40, 324)">
      <!-- Pill 1 -->
      <rect width="140" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#06B6D4"/>
      <rect x="32" y="13" width="86" height="8" rx="4" fill="#1E293B"/>

      <!-- Pill 2 -->
      <g transform="translate(156, 0)">
        <rect width="140" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#10B981"/>
        <rect x="32" y="13" width="86" height="8" rx="4" fill="#1E293B"/>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(312, 0)">
        <rect width="168" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#6366F1"/>
        <rect x="32" y="13" width="112" height="8" rx="4" fill="#1E293B"/>
      </g>
    </g>
  </g>

  <!-- Stacked Minimalist Coins Motif (Top Right) -->
  <g transform="translate(890, 110)" filter="url(#sal-element-shadow)">
    <!-- Base Coin -->
    <ellipse cx="60" cy="110" rx="48" ry="18" fill="#292524"/>
    <ellipse cx="60" cy="104" rx="48" ry="18" fill="#06B6D4"/>
    <ellipse cx="60" cy="100" rx="44" ry="15" fill="#22D3EE"/>
    
    <!-- Middle Coin -->
    <ellipse cx="60" cy="80" rx="48" ry="18" fill="#292524"/>
    <ellipse cx="60" cy="74" rx="48" ry="18" fill="#E6E6FA"/>
    <ellipse cx="60" cy="70" rx="44" ry="15" fill="#FFFFFF"/>
    <circle cx="60" cy="70" r="8" fill="#4F46E5" opacity="0.3"/>

    <!-- Top Coin in Warm Amber -->
    <ellipse cx="60" cy="50" rx="48" ry="18" fill="#D97706"/>
    <ellipse cx="60" cy="44" rx="48" ry="18" fill="#F59E0B"/>
    <ellipse cx="60" cy="40" rx="44" ry="15" fill="#FDE68A"/>
    <circle cx="60" cy="40" r="8" fill="#D97706"/>
  </g>

  <!-- Floating Offer / Compensation Badge (Bottom Left) -->
  <g transform="translate(130, 360)" filter="url(#sal-element-shadow)">
    <rect width="180" height="110" rx="22" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#E8EFE8"/>
    <path d="M36 24V48M28 32L36 24L44 32" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="66" y="26" width="94" height="10" rx="5" fill="#0E7490"/>
    <rect x="66" y="42" width="60" height="8" rx="4" fill="#94A3B8"/>

    <rect x="20" y="70" width="140" height="22" rx="11" fill="#CFFAFE"/>
    <rect x="36" y="77" width="108" height="8" rx="4" fill="#0891B2"/>
  </g>

  <!-- Sparkles & Floating Particles -->
  <circle cx="210" cy="170" r="5" fill="#06B6D4"/>
  <circle cx="1030" cy="280" r="6" fill="#06B6D4"/>
  <circle cx="980" cy="380" r="4" fill="#E8EFE8"/>
  <path d="M190 280L193 288L201 291L193 294L190 302L187 294L179 291L187 288Z" fill="#F59E0B"/>
</svg>
