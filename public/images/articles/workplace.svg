<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="wp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0C1E2E" flood-opacity="0.08" />
    </filter>
    <filter id="wp-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Clean Crisp White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Lights -->
  <circle cx="320" cy="180" r="260" fill="#F0F9FF" filter="url(#wp-blur)"/>
  <circle cx="900" cy="220" r="260" fill="#E0F2FE" opacity="0.6" filter="url(#wp-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="420" ry="20" fill="#E5E7EB" opacity="0.6"/>
  <ellipse cx="600" cy="582" rx="260" ry="12" fill="#BAE6FD" opacity="0.4"/>

  <!-- Collaborative Workspace Desk Surface -->
  <g transform="translate(240, 280)" filter="url(#wp-shadow)">
    <!-- Desk Surface -->
    <rect width="720" height="180" rx="16" fill="#F0F9FF" stroke="#E5E7EB" stroke-width="2"/>

    <!-- Desk Items -->
    <!-- Laptop in Center -->
    <g transform="translate(220, -140)">
      <rect width="280" height="190" rx="14" fill="#0C1E2E"/>
      <rect x="10" y="10" width="260" height="170" rx="10" fill="#FFFFFF"/>
      <!-- Screen Dashboard -->
      <rect x="24" y="24" width="70" height="8" rx="4" fill="#0369A1"/>
      <rect x="24" y="42" width="100" height="50" rx="6" fill="#E0F2FE"/>
      <rect x="136" y="42" width="100" height="50" rx="6" fill="#F0F9FF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="24" y="104" width="212" height="30" rx="6" fill="#F0F9FF"/>
      <!-- Laptop Base -->
      <path d="M-30 190 H310 L330 204 H-50 Z" fill="#CBD5E1"/>
    </g>

    <!-- Coffee Mug on Right -->
    <g transform="translate(560, 40)">
      <rect width="36" height="48" rx="8" fill="#0369A1"/>
      <path d="M36 12 C46 12 46 36 36 36" stroke="#0369A1" stroke-width="4" fill="none"/>
      <!-- Steam -->
      <path d="M12 -8 C10 -16 16 -20 12 -28" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M24 -8 C22 -16 28 -20 24 -28" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Potted Plant on Left -->
    <g transform="translate(80, 20)">
      <!-- Pot -->
      <polygon points="12,50 48,50 42,85 18,85" fill="#0C1E2E"/>
      <!-- Leaves -->
      <path d="M30 50 C20 30 10 32 12 18 C26 22 28 38 30 50Z" fill="#0EA5E9"/>
      <path d="M30 50 C40 30 50 32 48 18 C34 22 32 38 30 50Z" fill="#0369A1"/>
      <path d="M30 50 C24 24 30 8 30 0 C36 8 36 24 30 50Z" fill="#059669"/>
    </g>

    <!-- Notebook & Pen -->
    <g transform="translate(140, 70)">
      <rect width="60" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="12" y1="18" x2="48" y2="18" stroke="#E5E7EB" stroke-width="2"/>
      <line x1="12" y1="30" x2="48" y2="30" stroke="#E5E7EB" stroke-width="2"/>
      <line x1="12" y1="42" x2="48" y2="42" stroke="#E5E7EB" stroke-width="2"/>
      <!-- Stylus / Pen -->
      <rect x="68" y="10" width="5" height="60" rx="2.5" fill="#0EA5E9"/>
    </g>
  </g>

  <!-- Left Wall Notice Board Sticky Notes -->
  <g transform="translate(100, 100)" filter="url(#wp-shadow)">
    <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="14" fill="#0369A1"/>
    <rect x="58" y="26" width="95" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="58" y="40" width="65" height="6" rx="3" fill="#64748B"/>
    <!-- Sticky note 1 -->
    <rect x="22" y="66" width="60" height="50" rx="6" fill="#E0F2FE"/>
    <!-- Sticky note 2 -->
    <rect x="94" y="66" width="60" height="50" rx="6" fill="#F0F9FF" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- Right Wall Goal Tracker Board -->
  <g transform="translate(920, 90)" filter="url(#wp-shadow)">
    <rect width="180" height="150" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Target / Bullseye icon -->
    <circle cx="36" cy="36" r="16" fill="#E0F2FE"/>
    <circle cx="36" cy="36" r="10" stroke="#0369A1" stroke-width="2.5" fill="none"/>
    <circle cx="36" cy="36" r="4" fill="#0EA5E9"/>

    <rect x="62" y="28" width="90" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="62" y="42" width="60" height="6" rx="3" fill="#0EA5E9"/>

    <rect x="22" y="74" width="136" height="8" rx="4" fill="#F0F9FF"/>
    <rect x="22" y="74" width="105" height="8" rx="4" fill="#0369A1"/>

    <rect x="22" y="96" width="136" height="8" rx="4" fill="#F0F9FF"/>
    <rect x="22" y="96" width="80" height="8" rx="4" fill="#0EA5E9"/>

    <rect x="22" y="118" width="136" height="8" rx="4" fill="#F0F9FF"/>
    <rect x="22" y="118" width="120" height="8" rx="4" fill="#0369A1"/>
  </g>
</svg>
