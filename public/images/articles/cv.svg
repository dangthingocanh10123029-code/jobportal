<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="cv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0C1E2E" flood-opacity="0.08" />
    </filter>
    <filter id="cv-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Clean Crisp White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Light Blobs -->
  <circle cx="280" cy="180" r="240" fill="#F0F9FF" filter="url(#cv-blur)"/>
  <circle cx="940" cy="220" r="260" fill="#E0F2FE" opacity="0.6" filter="url(#cv-blur)"/>
  <circle cx="600" cy="520" r="280" fill="#F0F9FF" filter="url(#cv-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="380" ry="20" fill="#E5E7EB" opacity="0.6"/>
  <ellipse cx="600" cy="582" rx="220" ry="12" fill="#BAE6FD" opacity="0.4"/>

  <!-- Background Offset Document Card -->
  <g transform="translate(430, 56) rotate(4 240 250)">
    <rect width="460" height="490" rx="24" fill="#F0F9FF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="40" y="44" width="160" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="40" y="70" width="360" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="40" y="88" width="300" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="40" y="106" width="330" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- Main Professional CV Document Card -->
  <g transform="translate(360, 48)" filter="url(#cv-shadow)">
    <!-- Main Card Body -->
    <rect width="480" height="520" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Paperclip in Primary Blue -->
    <path d="M72 8V44C72 52 64 58 56 58C48 58 40 52 40 44V18C40 12 44 8 50 8C56 8 60 12 60 18V42C60 45 58 47 55 47C52 47 50 45 50 42V18" stroke="#0369A1" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- CV Header: Avatar Placeholder & Identity Lines -->
    <g transform="translate(48, 48)">
      <circle cx="40" cy="40" r="32" fill="#E0F2FE"/>
      <circle cx="40" cy="34" r="14" fill="#0369A1"/>
      <path d="M22 62C22 50 30 48 40 48C50 48 58 50 58 62" fill="#0369A1"/>

      <!-- Title lines -->
      <rect x="92" y="18" width="160" height="16" rx="8" fill="#0C1E2E"/>
      <rect x="92" y="42" width="110" height="10" rx="5" fill="#0EA5E9"/>
      <rect x="92" y="58" width="80" height="8" rx="4" fill="#64748B"/>
    </g>

    <!-- Divider -->
    <line x1="48" y1="144" x2="432" y2="144" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Section 1: Experience Timeline -->
    <g transform="translate(48, 168)">
      <rect x="0" y="0" width="120" height="12" rx="6" fill="#0369A1"/>

      <!-- Item 1 -->
      <circle cx="8" cy="36" r="5" fill="#0EA5E9"/>
      <line x1="8" y1="41" x2="8" y2="85" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="28" y="28" width="180" height="10" rx="5" fill="#0C1E2E"/>
      <rect x="28" y="44" width="340" height="7" rx="3.5" fill="#64748B"/>
      <rect x="28" y="57" width="280" height="7" rx="3.5" fill="#E2E8F0"/>

      <!-- Item 2 -->
      <circle cx="8" cy="95" r="5" fill="#0369A1"/>
      <rect x="28" y="87" width="160" height="10" rx="5" fill="#0C1E2E"/>
      <rect x="28" y="103" width="320" height="7" rx="3.5" fill="#64748B"/>
      <rect x="28" y="116" width="260" height="7" rx="3.5" fill="#E2E8F0"/>
    </g>

    <!-- Section 2: Skills Badges -->
    <g transform="translate(48, 332)">
      <rect x="0" y="0" width="90" height="12" rx="6" fill="#0369A1"/>

      <!-- Skill Pills -->
      <rect x="0" y="24" width="76" height="24" rx="12" fill="#E0F2FE"/>
      <rect x="12" y="32" width="52" height="8" rx="4" fill="#0369A1"/>

      <rect x="88" y="24" width="92" height="24" rx="12" fill="#E0F2FE"/>
      <rect x="100" y="32" width="68" height="8" rx="4" fill="#0369A1"/>

      <rect x="192" y="24" width="84" height="24" rx="12" fill="#E0F2FE"/>
      <rect x="204" y="32" width="60" height="8" rx="4" fill="#0369A1"/>

      <rect x="288" y="24" width="70" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.15"/>
      <rect x="300" y="32" width="46" height="8" rx="4" fill="#0EA5E9"/>
    </g>

    <!-- Floating Verified Checkmark Badge -->
    <g transform="translate(410, 440)">
      <circle cx="28" cy="28" r="26" fill="#0EA5E9"/>
      <path d="M19 28L25 34L37 22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Left Floating Auxiliary Badge Card -->
  <g transform="translate(140, 200)" filter="url(#cv-shadow)">
    <rect width="180" height="100" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#E0F2FE"/>
    <path d="M28 36L33 41L44 30" stroke="#0369A1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="28" width="90" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="64" y="42" width="60" height="6" rx="3" fill="#64748B"/>
    <rect x="20" y="68" width="140" height="6" rx="3" fill="#F0F9FF"/>
    <rect x="20" y="68" width="95" height="6" rx="3" fill="#0EA5E9"/>
  </g>

  <!-- Right Floating Badge -->
  <g transform="translate(900, 320)" filter="url(#cv-shadow)">
    <rect width="160" height="90" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="14" fill="#0369A1"/>
    <rect x="60" y="26" width="74" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="60" y="40" width="50" height="6" rx="3" fill="#0EA5E9"/>
    <rect x="20" y="62" width="120" height="4" rx="2" fill="#E0F2FE"/>
  </g>
</svg>
