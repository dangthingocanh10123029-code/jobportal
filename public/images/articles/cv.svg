<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="cv-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="element-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="cv-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Floating Ambient Blobs -->
  <circle cx="280" cy="180" r="260" fill="#CFFAFE" opacity="0.65" filter="url(#cv-blur)"/>
  <circle cx="940" cy="200" r="280" fill="#E6E6FA" opacity="0.6" filter="url(#cv-blur)"/>
  <circle cx="820" cy="500" r="240" fill="#EFEDF4" opacity="0.5" filter="url(#cv-blur)"/>
  <circle cx="220" cy="520" r="220" fill="#E8EFE8" opacity="0.55" filter="url(#cv-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="380" ry="24" fill="#F1F5F9"/>
  <ellipse cx="600" cy="582" rx="240" ry="14" fill="#CFFAFE" opacity="0.5"/>

  <!-- Background Auxiliary Document Card (Offset Layer) -->
  <g transform="translate(420, 52) rotate(4 240 250)">
    <rect width="460" height="490" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="40" width="180" height="14" rx="7" fill="#E2E8F0"/>
    <rect x="40" y="66" width="380" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="40" y="84" width="320" height="8" rx="4" fill="#F1F5F9"/>
  </g>

  <!-- Main Professional CV Document Card -->
  <g transform="translate(360, 48)" filter="url(#cv-shadow)">
    <!-- Main Card Body -->
    <rect width="480" height="520" rx="28" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>

    <!-- Top Paper Clip in Deep Cyan -->
    <path d="M70 12V-14C70 -26 84 -26 84 -14V34C84 48 60 48 60 34V-4C60 -12 72 -12 72 -4V28" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Header Section -->
    <g transform="translate(48, 48)">
      <!-- Candidate Avatar -->
      <circle cx="44" cy="44" r="44" fill="#CFFAFE"/>
      <circle cx="44" cy="36" r="18" fill="#0E7490"/>
      <path d="M16 76C16 60 28 58 44 58C60 58 72 60 72 76H16Z" fill="#0E7490"/>
      <!-- Inner Ring -->
      <circle cx="44" cy="44" r="41" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Name & Title Bars -->
      <rect x="110" y="18" width="220" height="20" rx="10" fill="#0E7490"/>
      <rect x="110" y="48" width="150" height="14" rx="7" fill="#94A3B8"/>
      <rect x="110" y="70" width="90" height="10" rx="5" fill="#CBD5E1"/>
    </g>

    <!-- Hairline Divider -->
    <line x1="48" y1="160" x2="432" y2="160" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Skill Chips Row -->
    <g transform="translate(48, 178)">
      <!-- Chip 1 -->
      <rect width="92" height="30" rx="15" fill="#CFFAFE"/>
      <rect x="16" y="10" width="60" height="10" rx="5" fill="#0891B2"/>

      <!-- Chip 2 -->
      <g transform="translate(104, 0)">
        <rect width="84" height="30" rx="15" fill="#E6E6FA"/>
        <rect x="16" y="10" width="52" height="10" rx="5" fill="#4F46E5"/>
      </g>

      <!-- Chip 3 -->
      <g transform="translate(200, 0)">
        <rect width="102" height="30" rx="15" fill="#E8EFE8"/>
        <rect x="16" y="10" width="70" height="10" rx="5" fill="#059669"/>
      </g>
    </g>

    <!-- Experience Section (Timeline) -->
    <g transform="translate(48, 236)">
      <!-- Section Header -->
      <rect width="130" height="14" rx="7" fill="#292524"/>
      <circle cx="-12" cy="7" r="4" fill="#06B6D4"/>

      <!-- Item 1 -->
      <g transform="translate(0, 28)">
        <circle cx="6" cy="6" r="5" fill="#06B6D4"/>
        <line x1="6" y1="14" x2="6" y2="60" stroke="#E2E8F0" stroke-width="2"/>
        <rect x="22" y="0" width="190" height="12" rx="6" fill="#1E293B"/>
        <rect x="22" y="18" width="340" height="9" rx="4.5" fill="#F1F5F9"/>
        <rect x="22" y="33" width="290" height="9" rx="4.5" fill="#F1F5F9"/>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 96)">
        <circle cx="6" cy="6" r="5" fill="#A5F3FC"/>
        <line x1="6" y1="14" x2="6" y2="40" stroke="#E2E8F0" stroke-width="2"/>
        <rect x="22" y="0" width="160" height="12" rx="6" fill="#1E293B"/>
        <rect x="22" y="18" width="320" height="9" rx="4.5" fill="#F1F5F9"/>
      </g>
    </g>

    <!-- Skill Progress Meters at Bottom -->
    <g transform="translate(48, 412)">
      <rect width="110" height="12" rx="6" fill="#292524"/>
      
      <!-- Progress Bar 1 -->
      <g transform="translate(0, 22)">
        <rect width="384" height="10" rx="5" fill="#F1F5F9"/>
        <rect width="320" height="10" rx="5" fill="#06B6D4"/>
      </g>

      <!-- Progress Bar 2 -->
      <g transform="translate(0, 42)">
        <rect width="384" height="10" rx="5" fill="#F1F5F9"/>
        <rect width="260" height="10" rx="5" fill="#22D3EE"/>
      </g>
    </g>
  </g>

  <!-- Elegant Pen / Stylus on Left Side -->
  <g transform="translate(240, 360) rotate(-35)" filter="url(#element-shadow)">
    <!-- Pen Body in Dark Stone -->
    <rect width="18" height="240" rx="9" fill="#292524"/>
    <!-- Cyan Ring -->
    <rect y="40" width="18" height="8" fill="#06B6D4"/>
    <!-- Pen Clip -->
    <rect x="-4" y="20" width="4" height="70" rx="2" fill="#E2E8F0"/>
    <!-- Pen Tip Cone -->
    <polygon points="0,240 18,240 9,270" fill="#CBD5E1"/>
    <!-- Nib in Cyan -->
    <polygon points="6,260 12,260 9,276" fill="#06B6D4"/>
  </g>

  <!-- Floating Verified Checkmark Badge on Right -->
  <g transform="translate(860, 110)" filter="url(#element-shadow)">
    <rect width="180" height="64" rx="32" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
    <circle cx="36" cy="32" r="22" fill="#E8EFE8"/>
    <path d="M26 32L32 38L46 24" stroke="#15803D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="22" width="76" height="10" rx="5" fill="#0E7490"/>
    <rect x="70" y="38" width="50" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Minimalist Ceramic Potted Plant on Bottom Right -->
  <g transform="translate(900, 420)">
    <!-- Leaves -->
    <path d="M30 60C30 20 60 10 70 0C74 24 64 50 46 60Z" fill="#059669"/>
    <path d="M34 60C26 40 10 30 0 24C16 30 28 42 34 60Z" fill="#10B981"/>
    <path d="M38 60C44 36 60 30 68 24C62 38 52 50 42 60Z" fill="#34D399"/>
    <!-- Dark Stone Pot -->
    <path d="M22 60L26 84H48L52 60Z" fill="#292524"/>
    <rect x="20" y="58" width="34" height="5" rx="2.5" fill="#1C1917"/>
  </g>

  <!-- Sparkles & Floating Dots -->
  <circle cx="210" cy="180" r="6" fill="#06B6D4"/>
  <circle cx="270" cy="120" r="4" fill="#CFFAFE"/>
  <circle cx="980" cy="320" r="6" fill="#E6E6FA"/>
  <circle cx="1030" cy="240" r="4" fill="#06B6D4"/>
  <path d="M190 280L193 288L201 291L193 294L190 302L187 294L179 291L187 288Z" fill="#F59E0B"/>
</svg>
