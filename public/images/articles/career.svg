<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="car-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="car-element-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="car-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Pastel Blobs -->
  <circle cx="280" cy="190" r="270" fill="#E6E6FA" opacity="0.65" filter="url(#car-blur)"/>
  <circle cx="950" cy="200" r="280" fill="#CFFAFE" opacity="0.7" filter="url(#car-blur)"/>
  <circle cx="850" cy="500" r="240" fill="#EFEDF4" opacity="0.55" filter="url(#car-blur)"/>
  <circle cx="200" cy="510" r="220" fill="#E8EFE8" opacity="0.5" filter="url(#car-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="570" rx="420" ry="24" fill="#F1F5F9"/>
  <ellipse cx="600" cy="572" rx="260" ry="14" fill="#CFFAFE" opacity="0.5"/>

  <!-- Main Career Journey Roadmap Card -->
  <g transform="translate(310, 80)" filter="url(#car-shadow)">
    <rect width="580" height="400" rx="28" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>

    <!-- Header Section -->
    <g transform="translate(44, 36)">
      <!-- Roadmap Flag Icon in Cyan -->
      <circle cx="22" cy="22" r="22" fill="#CFFAFE"/>
      <path d="M16 12V32M16 14H28L24 19L28 24H16" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="60" y="10" width="190" height="14" rx="7" fill="#0E7490"/>
      <rect x="60" y="30" width="120" height="10" rx="5" fill="#94A3B8"/>

      <!-- Milestone Step Progress Indicator -->
      <g transform="translate(360, 10)">
        <rect width="130" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="14" r="6" fill="#10B981"/>
        <circle cx="65" cy="14" r="6" fill="#06B6D4"/>
        <circle cx="110" cy="14" r="6" fill="#F59E0B"/>
      </g>
    </g>

    <!-- Hairline Separator -->
    <line x1="44" y1="96" x2="536" y2="96" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Main Stepped Ascent Graphic Area -->
    <g transform="translate(44, 115)">
      <!-- Ascending Dashed Path Line -->
      <path d="M70 200 C 130 190, 180 130, 240 120 C 310 110, 360 40, 430 30" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" fill="none"/>

      <!-- Stepped Milestone 1 (Foundation) -->
      <g transform="translate(20, 150)">
        <rect width="110" height="70" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
        <circle cx="30" cy="26" r="14" fill="#E6E6FA"/>
        <rect x="22" y="22" width="16" height="8" rx="2" fill="#4F46E5"/>
        <rect x="52" y="22" width="46" height="8" rx="4" fill="#1E293B"/>
        <rect x="22" y="46" width="66" height="6" rx="3" fill="#94A3B8"/>
      </g>

      <!-- Milestone 1 Node -->
      <circle cx="75" cy="140" r="10" fill="#E6E6FA" stroke="#4F46E5" stroke-width="2.5"/>
      <circle cx="75" cy="140" r="4" fill="#4F46E5"/>

      <!-- Stepped Milestone 2 (Growth & Specialization) -->
      <g transform="translate(185, 80)">
        <rect width="120" height="76" rx="16" fill="#CFFAFE" fill-opacity="0.4" stroke="#A5F3FC" stroke-width="1.2"/>
        <circle cx="32" cy="28" r="14" fill="#CFFAFE"/>
        <path d="M26 28L30 32L38 24" stroke="#0891B2" stroke-width="2" stroke-linecap="round"/>
        <rect x="54" y="24" width="52" height="8" rx="4" fill="#0E7490"/>
        <rect x="24" y="50" width="72" height="6" rx="3" fill="#0891B2"/>
      </g>

      <!-- Milestone 2 Node in Cyan -->
      <circle cx="245" cy="70" r="12" fill="#06B6D4" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="245" cy="70" r="5" fill="#FFFFFF"/>

      <!-- Stepped Milestone 3 (Mastery & Leadership) -->
      <g transform="translate(365, 10)">
        <rect width="130" height="84" rx="18" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" filter="url(#car-element-shadow)"/>
        <circle cx="34" cy="30" r="16" fill="#FEF3C7"/>
        <!-- Star Icon -->
        <path d="M34 20L36.5 26L42 27L38 31L39 36.5L34 33.8L29 36.5L30 31L26 27L31.5 26L34 20Z" fill="#F59E0B"/>
        <rect x="58" y="26" width="58" height="9" rx="4.5" fill="#D97706"/>
        <rect x="24" y="54" width="82" height="7" rx="3.5" fill="#94A3B8"/>
      </g>

      <!-- Milestone 3 Node in Gold/Cyan -->
      <circle cx="430" cy="0" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="430" cy="0" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Journey Tags -->
    <g transform="translate(44, 330)">
      <rect width="150" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#06B6D4"/>
      <rect x="32" y="13" width="96" height="8" rx="4" fill="#1E293B"/>

      <g transform="translate(166, 0)">
        <rect width="150" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#10B981"/>
        <rect x="32" y="13" width="96" height="8" rx="4" fill="#1E293B"/>
      </g>

      <g transform="translate(332, 0)">
        <rect width="160" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#F59E0B"/>
        <rect x="32" y="13" width="106" height="8" rx="4" fill="#1E293B"/>
      </g>
    </g>
  </g>

  <!-- Modern Career Compass Motif (Top Left) -->
  <g transform="translate(130, 130)" filter="url(#car-element-shadow)">
    <!-- Compass Housing in Dark Stone -->
    <circle cx="60" cy="60" r="54" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <circle cx="60" cy="60" r="46" fill="#FAFAF9" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="38" stroke="#CFFAFE" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Compass Cardinal Markers -->
    <rect x="58.5" y="18" width="3" height="7" rx="1.5" fill="#292524"/>
    <rect x="58.5" y="95" width="3" height="7" rx="1.5" fill="#94A3B8"/>
    <rect x="18" y="58.5" width="7" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="95" y="58.5" width="7" height="3" rx="1.5" fill="#94A3B8"/>

    <!-- Needle Pointing North-East in Cyan & Dark Stone -->
    <polygon points="60,26 66,60 60,54 54,60" fill="#06B6D4"/>
    <polygon points="60,94 66,60 60,66 54,60" fill="#292524"/>
    <circle cx="60" cy="60" r="5" fill="#FFFFFF" stroke="#292524" stroke-width="1.5"/>
  </g>

  <!-- Target / Goal Bullseye Card (Bottom Right) -->
  <g transform="translate(870, 360)" filter="url(#car-element-shadow)">
    <rect width="190" height="116" rx="22" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
    
    <!-- Target Concentric Rings -->
    <circle cx="48" cy="58" r="32" fill="#CFFAFE" fill-opacity="0.4"/>
    <circle cx="48" cy="58" r="22" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="48" cy="58" r="12" fill="#06B6D4"/>
    <circle cx="48" cy="58" r="4" fill="#FFFFFF"/>

    <!-- Target Arrows / Bars -->
    <rect x="94" y="38" width="76" height="10" rx="5" fill="#0E7490"/>
    <rect x="94" y="54" width="56" height="8" rx="4" fill="#94A3B8"/>
    <rect x="94" y="70" width="40" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Sparkles & Floating Dots -->
  <circle cx="230" cy="280" r="5" fill="#06B6D4"/>
  <circle cx="1020" cy="180" r="6" fill="#06B6D4"/>
  <circle cx="980" cy="270" r="4" fill="#E6E6FA"/>
  <path d="M1040 220L1043 228L1051 231L1043 234L1040 242L1037 234L1029 231L1037 228Z" fill="#F59E0B"/>
</svg>
