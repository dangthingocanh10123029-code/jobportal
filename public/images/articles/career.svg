<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <filter id="car-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0C1E2E" flood-opacity="0.08" />
    </filter>
    <filter id="car-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Clean Crisp White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Soft Ambient Lights -->
  <circle cx="340" cy="180" r="260" fill="#F0F9FF" filter="url(#car-blur)"/>
  <circle cx="880" cy="240" r="260" fill="#E0F2FE" opacity="0.6" filter="url(#car-blur)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="600" cy="580" rx="400" ry="20" fill="#E5E7EB" opacity="0.6"/>
  <ellipse cx="600" cy="582" rx="240" ry="12" fill="#BAE6FD" opacity="0.4"/>

  <!-- Central Career Ladder / Progression Staircase -->
  <g transform="translate(280, 80)" filter="url(#car-shadow)">
    <!-- Main Card Body -->
    <rect width="640" height="460" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="44" y="36" width="150" height="14" rx="7" fill="#0C1E2E"/>
    <rect x="44" y="58" width="95" height="8" rx="4" fill="#64748B"/>

    <!-- Staircase Steps -->
    <!-- Step 1: Entry Level -->
    <rect x="60" y="340" width="110" height="70" rx="10" fill="#F0F9FF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="115" cy="375" r="16" fill="#E0F2FE"/>
    <circle cx="115" cy="375" r="6" fill="#0369A1"/>

    <!-- Step 2: Mid Level -->
    <rect x="190" y="270" width="110" height="140" rx="10" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="245" cy="305" r="16" fill="#BAE6FD"/>
    <circle cx="245" cy="305" r="6" fill="#0369A1"/>

    <!-- Step 3: Senior Level -->
    <rect x="320" y="200" width="110" height="210" rx="10" fill="#0EA5E9" fill-opacity="0.15" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="375" cy="235" r="16" fill="#0EA5E9"/>
    <circle cx="375" cy="235" r="6" fill="#FFFFFF"/>

    <!-- Step 4: Lead / Director Summit -->
    <rect x="450" y="130" width="130" height="280" rx="12" fill="#0369A1"/>
    <!-- Summit Star Emblem -->
    <circle cx="515" cy="180" r="28" fill="#0EA5E9"/>
    <polygon points="515,164 520,175 532,176 523,184 526,196 515,190 504,196 507,184 498,176 510,175" fill="#FFFFFF"/>
    <!-- Summit flag lines -->
    <rect x="480" y="230" width="70" height="8" rx="4" fill="#E0F2FE"/>
    <rect x="490" y="246" width="50" height="6" rx="3" fill="#E0F2FE"/>

    <!-- Ascending Pathway Dotted Line -->
    <path d="M115 340 L 245 270 L 375 200 L 515 130" stroke="#0369A1" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  </g>

  <!-- Left Floating Compass Badge Card -->
  <g transform="translate(80, 160)" filter="url(#car-shadow)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="80" cy="70" r="40" fill="#F0F9FF" stroke="#0369A1" stroke-width="2"/>
    <!-- Compass Needle -->
    <polygon points="80,40 88,70 80,64 72,70" fill="#0369A1"/>
    <polygon points="80,100 88,70 80,76 72,70" fill="#0C1E2E"/>
    <circle cx="80" cy="70" r="4" fill="#FFFFFF"/>

    <rect x="40" y="126" width="80" height="8" rx="4" fill="#0C1E2E"/>
    <rect x="55" y="140" width="50" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- Right Floating Milestone Card -->
  <g transform="translate(960, 200)" filter="url(#car-shadow)">
    <rect width="160" height="150" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="#0EA5E9"/>
    <path d="M38 45L43 50L53 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="75" y="36" width="65" height="9" rx="4.5" fill="#0C1E2E"/>
    <rect x="75" y="50" width="45" height="6" rx="3" fill="#0EA5E9"/>

    <rect x="22" y="85" width="116" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="22" y="100" width="85" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="22" y="115" width="105" height="6" rx="3" fill="#E5E7EB"/>
  </g>
</svg>
