    <!-- Base Platform in Soft Lavender -->
    <rect x="12" y="62" width="28" height="6" rx="3" fill="#E6E6FA"/>
    <!-- Support Post -->
    <rect x="23" y="44" width="6" height="20" rx="3" fill="#292524"/>

