    <circle cx="26" cy="18" r="8" fill="#06B6D4"/>
    <circle cx="26" cy="18" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Floating Job Notification Envelope on Right -->
  <g transform="translate(144, 46)">
    <rect width="48" height="34" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
    <path d="M4 6L24 20L44 6" stroke="#E7E5E4" stroke-width="1.5" stroke-linecap="round"/>
    
