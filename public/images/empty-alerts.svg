  <circle cx="50" cy="106" r="5" fill="#EFEDF4"/>
  <circle cx="188" cy="100" r="4" fill="#CFFAFE"/>
  <path d="M78 36L80 41L85 43L80 45L78 50L76 45L71 43L76 41L78 36Z" fill="#F59E0B" opacity="0.8"/>
