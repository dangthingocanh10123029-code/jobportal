<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="155" rx="72" ry="12" fill="#F5F5F4"/>
  <ellipse cx="120" cy="156" rx="46" ry="7" fill="#CFFAFE" opacity="0.6"/>

  <!-- Concentric Alert Signal Arcs -->
  <path d="M72 88C72 61.4903 93.4903 40 120 40C146.51 40 168 61.4903 168 88" stroke="#CFFAFE" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M86 88C86 69.2223 101.222 54 120 54C138.778 54 154 69.2223 154 88" stroke="#E6E6FA" stroke-width="2.5"/>

  <!-- Alert Beacon / Bell Centerpiece in Dark Stone -->
