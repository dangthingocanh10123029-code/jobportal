<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Ground Soft Shadows -->
  <ellipse cx="120" cy="155" rx="68" ry="11" fill="#F0F9FF"/>
  <ellipse cx="120" cy="156" rx="42" ry="6" fill="#E0F2FE" opacity="0.6"/>

  <!-- Sound Waves (Muted/Silent) -->
  <path d="M72 74C68 82 68 94 72 102" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
  <path d="M168 74C172 82 172 94 168 102" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>

  <!-- Bell Container -->
  <g transform="translate(90, 42)">
    <!-- Bell Top Ring -->
    <path d="M30 14V8C30 5 32 3 35 3C38 3 40 5 40 8V14" stroke="#0369A1" stroke-width="2.5" fill="none"/>

    <!-- Bell Dome in White with Blue Border & Soft Fill -->
    <path d="M14 58C14 42 22 36 26 22C27 18 30 16 35 16C40 16 43 18 44 22C48 36 56 42 56 58H14Z" fill="#F0F9FF" stroke="#0369A1" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Bell Base Rim -->
    <rect x="8" y="58" width="54" height="6" rx="3" fill="#0369A1"/>

    <!-- Bell Clapper -->
    <circle cx="35" cy="69" r="6" fill="#0EA5E9"/>

    <!-- Subtle Clean Glare Line -->
    <path d="M26 32C28 26 31 22 35 22" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ambient Dots -->
  <circle cx="56" cy="56" r="4" fill="#E0F2FE"/>
  <circle cx="186" cy="64" r="5" fill="#E0F2FE"/>
  <circle cx="176" cy="118" r="3" fill="#0EA5E9"/>
</svg>
