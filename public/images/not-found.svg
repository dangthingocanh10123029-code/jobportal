<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <!-- Soft Ambient Ground Blobs -->
  <ellipse cx="160" cy="208" rx="120" ry="18" fill="#F0F9FF"/>
  <ellipse cx="160" cy="210" rx="80" ry="10" fill="#E0F2FE" opacity="0.7"/>

  <!-- Soft 404 Watermark in Inter font -->
  <text x="160" y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="700" fill="#E5E7EB" text-anchor="middle" letter-spacing="-0.035em">
    404
  </text>

  <!-- Minimalist Signpost Mast in Dark Slate -->
  <rect x="156" y="74" width="8" height="135" rx="4" fill="#0C1E2E"/>
  <circle cx="160" cy="70" r="7" fill="#0369A1"/>

  <!-- Sign Arrow Left (Primary Blue) -->
  <g transform="translate(80, 88)">
    <path d="M78 0 H20 L0 16 L20 32 H78 Z" fill="#0369A1"/>
    <circle cx="64" cy="16" r="3" fill="#FFFFFF"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Sign Arrow Right (Soft Blue Surface) -->
  <g transform="translate(162, 128)">
    <path d="M0 0 H58 L78 16 L58 32 H0 Z" fill="#E0F2FE"/>
    <circle cx="14" cy="16" r="3" fill="#0369A1"/>
    <circle cx="62" cy="16" r="3" fill="#0369A1"/>
  </g>

  <!-- Modern Compass Resting on Ground -->
  <g transform="translate(205, 172)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <polygon points="18,6 22,18 18,15 14,18" fill="#0369A1"/>
    <polygon points="18,30 22,18 18,21 14,18" fill="#0C1E2E"/>
    <circle cx="18" cy="18" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Floating Blue Blobs/Dots -->
  <circle cx="80" cy="56" r="5" fill="#E0F2FE"/>
  <circle cx="240" cy="50" r="6" fill="#F0F9FF"/>
  <circle cx="210" cy="62" r="3" fill="#0EA5E9"/>
</svg>
