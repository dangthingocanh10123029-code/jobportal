<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <!-- Soft Ambient Ground Blobs -->
  <ellipse cx="160" cy="208" rx="120" ry="18" fill="#F5F5F4"/>
  <ellipse cx="160" cy="210" rx="80" ry="10" fill="#CFFAFE" opacity="0.7"/>

  <!-- Soft 404 Watermark -->
  <text x="160" y="112" font-family="'Outfit', sans-serif" font-size="76" font-weight="600" fill="#E7E5E4" text-anchor="middle" letter-spacing="-0.035em">
    404
  </text>

  <!-- Minimalist Signpost Mast in Dark Stone -->
  <rect x="156" y="74" width="8" height="135" rx="4" fill="#292524"/>
  <circle cx="160" cy="70" r="7" fill="#06B6D4"/>

  <!-- Pill Sign Arrow Left (Cyan) -->
  <g transform="translate(80, 88)">
    <path d="M78 0 H20 L0 16 L20 32 H78 Z" fill="#06B6D4"/>
    <circle cx="64" cy="16" r="3" fill="#FFFFFF"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Pill Sign Arrow Right (Soft Lavender) -->
  <g transform="translate(162, 128)">
    <path d="M0 0 H58 L78 16 L58 32 H0 Z" fill="#E6E6FA"/>
    <circle cx="14" cy="16" r="3" fill="#4338CA"/>
    <circle cx="62" cy="16" r="3" fill="#4338CA"/>
  </g>

  <!-- Modern Compass Pill Resting on Ground -->
  <g transform="translate(205, 172)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <polygon points="18,6 22,18 18,15 14,18" fill="#06B6D4"/>
    <polygon points="18,30 22,18 18,21 14,18" fill="#292524"/>
    <circle cx="18" cy="18" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Floating Cyan & Lavender Blobs/Dots -->
  <circle cx="80" cy="56" r="5" fill="#CFFAFE"/>
  <circle cx="240" cy="50" r="6" fill="#E6E6FA"/>
  <circle cx="210" cy="62" r="3" fill="#06B6D4"/>
</svg>