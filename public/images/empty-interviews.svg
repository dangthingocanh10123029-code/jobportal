<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Ground Soft Shadows -->
  <ellipse cx="120" cy="155" rx="76" ry="12" fill="#F0F9FF"/>
  <ellipse cx="120" cy="156" rx="46" ry="7" fill="#E0F2FE" opacity="0.6"/>

  <!-- Desk Calendar Container -->
  <g transform="translate(70, 36)">
    <!-- Calendar Body -->
    <rect y="12" width="100" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Calendar Top Header Banner in Primary Blue -->
    <path d="M0 26C0 19.4 5.4 14 12 14H88C94.6 14 100 19.4 100 26V36H0V26Z" fill="#0369A1"/>

    <!-- Binder Rings in Dark Slate -->
    <rect x="22" y="6" width="6" height="14" rx="3" fill="#0C1E2E"/>
    <rect x="72" y="6" width="6" height="14" rx="3" fill="#0C1E2E"/>

    <!-- Calendar Date Grid Dots -->
    <circle cx="26" cy="52" r="3" fill="#CBD5E1"/>
    <circle cx="50" cy="52" r="3" fill="#CBD5E1"/>
    <circle cx="74" cy="52" r="3" fill="#CBD5E1"/>

    <circle cx="26" cy="70" r="3" fill="#CBD5E1"/>
    <!-- Highlighted Scheduled Date (Clock / Meeting) -->
    <circle cx="50" cy="70" r="10" fill="#E0F2FE"/>
    <circle cx="50" cy="70" r="4" fill="#0EA5E9"/>
    <circle cx="74" cy="70" r="3" fill="#CBD5E1"/>

    <circle cx="26" cy="88" r="3" fill="#CBD5E1"/>
    <circle cx="50" cy="88" r="3" fill="#CBD5E1"/>
    <circle cx="74" cy="88" r="3" fill="#CBD5E1"/>

    <!-- Video Camera Emblem in Accent Blue -->
    <g transform="translate(64, 76)">
      <rect width="28" height="20" rx="6" fill="#0EA5E9"/>
      <polygon points="28,6 36,2 36,18 28,14" fill="#0EA5E9"/>
      <circle cx="14" cy="10" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Ambient Floating Dots -->
  <circle cx="50" cy="50" r="4" fill="#E0F2FE"/>
  <circle cx="190" cy="60" r="5" fill="#0369A1"/>
  <circle cx="182" cy="114" r="3" fill="#0EA5E9"/>
</svg>
