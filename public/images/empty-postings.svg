<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Ground Soft Shadows -->
  <ellipse cx="120" cy="155" rx="76" ry="12" fill="#F0F9FF"/>
  <ellipse cx="120" cy="156" rx="48" ry="7" fill="#E0F2FE" opacity="0.7"/>

  <!-- Blank Posting Card Container -->
  <g transform="translate(62, 38)">
    <rect width="116" height="104" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Dotted Outline inner placeholder -->
    <rect x="10" y="10" width="96" height="84" rx="10" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- Briefcase Symbol in Primary Blue -->
    <g transform="translate(40, 26)">
      <rect x="4" y="10" width="28" height="20" rx="4" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
      <path d="M12 10V6C12 4.9 12.9 4 14 4H22C23.1 4 24 4.9 24 6V10" stroke="#0369A1" stroke-width="2"/>
      <line x1="4" y1="18" x2="32" y2="18" stroke="#0369A1" stroke-width="1.5"/>
      <rect x="16" y="16" width="4" height="4" rx="1" fill="#0EA5E9"/>
    </g>

    <!-- Create Plus Action Button in Primary Blue -->
    <circle cx="58" cy="74" r="14" fill="#0369A1"/>
    <path d="M58 67V81M51 74H65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Decorative Accent Dots -->
  <circle cx="48" cy="50" r="4" fill="#0EA5E9"/>
  <circle cx="192" cy="62" r="5" fill="#E0F2FE"/>
  <circle cx="184" cy="110" r="3" fill="#0369A1"/>
