<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#FEFCE8"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#FEF08A" stroke-width="2"/>
  <!-- Classic balanced scales of justice -->
  <!-- Central pillar -->
  <line x1="64" y1="24" x2="64" y2="98" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  <circle cx="64" cy="24" r="5" fill="#B45309" />
  <path fill="#1E293B" d="M 46,98 L 82,98 L 86,106 L 42,106 Z" />
  <!-- Horizontal balance beam -->
  <line x1="28" y1="40" x2="100" y2="40" stroke="#B45309" stroke-width="4.5" stroke-linecap="round" />
  <!-- Left scale pan -->
  <line x1="28" y1="40" x2="18" y2="68" stroke="#B45309" stroke-width="2" />
  <line x1="28" y1="40" x2="38" y2="68" stroke="#B45309" stroke-width="2" />
  <path fill="#B45309" d="M 14,68 C 14,78 42,78 42,68 Z" />
  <!-- Right scale pan -->
  <line x1="100" y1="40" x2="90" y2="68" stroke="#B45309" stroke-width="2" />
  <line x1="100" y1="40" x2="110" y2="68" stroke="#B45309" stroke-width="2" />
  <path fill="#B45309" d="M 86,68 C 86,78 114,78 114,68 Z" />
</svg>
