<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#1E3A8A"/>
  <!-- Perfectly vertical golden plumb-line & pillar of truth -->
  <!-- Top suspension ring -->
  <circle cx="64" cy="24" r="7" fill="none" stroke="#F59E0B" stroke-width="3.5" />
  <!-- Vertical true line -->
  <line x1="64" y1="31" x2="64" y2="60" stroke="#F59E0B" stroke-width="4" />
  <!-- Upright plumb bob -->
  <polygon points="52,60 76,60 64,96" fill="#F59E0B" />
  <circle cx="64" cy="60" r="12" fill="#FCD34D" />
  <!-- Symmetry balance ticks -->
  <line x1="38" y1="60" x2="46" y2="60" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <line x1="82" y1="60" x2="90" y2="60" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <!-- Ground reference -->
  <line x1="34" y1="104" x2="94" y2="104" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
</svg>
