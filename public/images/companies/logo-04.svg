<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <rect width="128" height="128" rx="28" fill="#F0F9FF"/>
  <!-- Isometric Cube -->
  <g transform="translate(64, 64)">
    <!-- Top Face -->
    <polygon points="0,-36 32,-18 0,0 -32,-18" fill="#0EA5E9"/>
    <!-- Left Face -->
    <polygon points="-32,-18 0,0 0,36 -32,18" fill="#0369A1"/>
    <!-- Right Face -->
    <polygon points="0,0 32,-18 32,18 0,36" fill="#0C1E2E"/>
    <!-- Center Inset Star -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
