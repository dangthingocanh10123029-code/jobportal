    <rect x="18" y="4" width="76" height="102" rx="10" fill="#E0F2FE" stroke="#CBD5E1" stroke-width="1" transform="rotate(6 56 55)"/>

    <!-- Front White Resume Sheet -->
    <rect x="12" y="8" width="76" height="104" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Resume Header Avatar -->
    <circle cx="32" cy="28" r="10" fill="#E0F2FE"/>
    <circle cx="32" cy="26" r="4.5" fill="#0369A1"/>
    <path d="M25 36C25 32.5 28 31 32 31C36 31 39 32.5 39 36" fill="#0369A1"/>

    <!-- Text Placeholders -->
    <rect x="48" y="22" width="30" height="5" rx="2.5" fill="#0C1E2E"/>
    <rect x="48" y="30" width="20" height="4" rx="2" fill="#64748B"/>

    <rect x="22" y="48" width="56" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="22" y="58" width="48" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="22" y="68" width="52" height="4" rx="2" fill="#E5E7EB"/>

