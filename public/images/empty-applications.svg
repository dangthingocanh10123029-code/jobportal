      <circle cx="16" cy="16" r="14" fill="#0EA5E9"/>
      <path d="M12 16L15 19L21 13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
