    <path d="M68 6V22C68 25.3 65.3 28 62 28C58.7 28 56 25.3 56 22V10C56 7.8 57.8 6 60 6C62.2 6 64 7.8 64 10V20" stroke="#0369A1" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Submission Waiting Badge -->
