# Render Blueprint — FastAPI backend (docs/deploy.md). Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: jobportal-api
    runtime: python
    region: singapore          # same region as the Supabase project (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL          # transaction pooler, port 6543
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY     # publishable key
        sync: false
      - key: ALLOWED_ORIGINS       # the Vercel domain, e.g. https://jobportal.vercel.app
        sync: false
